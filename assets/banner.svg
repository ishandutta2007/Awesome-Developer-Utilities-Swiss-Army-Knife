<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Orbs Gradient -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.15); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .anim-glow1 { animation: pulseGlow 6s ease-in-out infinite alternate; }
      .anim-glow2 { animation: pulseGlow 8s ease-in-out infinite alternate-reverse; }
      .anim-flow { stroke-dasharray: 8, 8; animation: dashFlow 2s linear infinite; }
      .card-1 { animation: floatCard 5s ease-in-out infinite; }
      .card-2 { animation: floatCard 6s ease-in-out infinite 1s; }
      .card-3 { animation: floatCard 5.5s ease-in-out infinite 2s; }
      .title-text { font-weight: 800; letter-spacing: -0.5px; }
      .subtitle-text { font-weight: 400; fill: #94a3b8; }
      .badge-bg { fill: #1e293b; stroke: #334155; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glowing Orbs in the background -->
  <circle cx="200" cy="100" r="180" fill="url(#glowCyan)" filter="url(#blurGlow)" class="anim-glow1" />
  <circle cx="1000" cy="300" r="220" fill="url(#glowPurple)" filter="url(#blurGlow)" class="anim-glow2" />

  <!-- Grid Pattern Overlay in Background -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Dynamic Connecting Circuit Flow Lines (behind text) -->
  <path d="M 80 340 C 250 340, 280 370, 500 370 S 800 320, 1120 320" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" class="anim-flow" />
  <path d="M 120 60 C 320 60, 420 30, 680 30 S 950 80, 1100 80" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.35" class="anim-flow" />

  <!-- Background Decorative Floating Pill / Tool Badges (Placed on edges so foreground stays clear) -->
  <g class="card-1" opacity="0.75">
    <rect x="50" y="240" width="135" height="42" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="117" y="266" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">⚡ JSON / YAML</text>
  </g>

  <g class="card-2" opacity="0.75">
    <rect x="1015" y="70" width="135" height="42" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
    <text x="1082" y="96" fill="#c084fc" font-size="13" font-weight="600" text-anchor="middle">🔐 JWT &amp; Crypto</text>
  </g>

  <g class="card-3" opacity="0.75">
    <rect x="1025" y="230" width="125" height="42" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="1087" y="256" fill="#34d399" font-size="13" font-weight="600" text-anchor="middle">🛠️ Offline First</text>
  </g>

  <!-- Foreground Content: Unobstructed & Ultra-Clear -->
  <g id="foreground-content">
    <!-- Category Mini-Badge -->
    <rect x="440" y="45" width="320" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="600" y="65" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">🛠️ CURATED DEVELOPER TOOLBOX</text>

    <!-- Main Title -->
    <text x="600" y="140" fill="url(#primaryGrad)" font-size="44" class="title-text" text-anchor="middle">
      Developer Utilities &amp; Swiss-Army Knife
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" font-size="18" class="subtitle-text" text-anchor="middle">
      Top All-in-One Developer Toolboxes • Self-Hosted Web Utilities • Offline Encoders &amp; Formatters
    </text>

    <!-- Feature Pills in Center-Bottom -->
    <g transform="translate(260, 225)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" />
        <circle cx="20" cy="18" r="5" fill="#38bdf8" />
        <text x="85" y="23" fill="#e2e8f0" font-size="13" font-weight="500" text-anchor="middle">All-in-One Suites</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(170, 0)">
        <rect width="160" height="36" rx="18" fill="#1e293b" stroke="#334155" />
        <circle cx="20" cy="18" r="5" fill="#818cf8" />
        <text x="90" y="23" fill="#e2e8f0" font-size="13" font-weight="500" text-anchor="middle">Docker &amp; Self-Hosted</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(350, 0)">
        <rect width="160" height="36" rx="18" fill="#1e293b" stroke="#334155" />
        <circle cx="20" cy="18" r="5" fill="#c084fc" />
        <text x="90" y="23" fill="#e2e8f0" font-size="13" font-weight="500" text-anchor="middle">Zero Cloud Leakage</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(530, 0)">
        <rect width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" />
        <circle cx="20" cy="18" r="5" fill="#34d399" />
        <text x="85" y="23" fill="#e2e8f0" font-size="13" font-weight="500" text-anchor="middle">CLI &amp; TUI Tools</text>
      </g>
    </g>

    <!-- Bottom Metric / Tagline bar -->
    <text x="600" y="325" fill="#64748b" font-size="13" font-weight="500" text-anchor="middle">
      Featuring CyberChef, IT-Tools, DevToys, Stirling-PDF, Hoppscotch, Excalidraw, jq, and leading SaaS Platforms
    </text>
  </g>
</svg>
